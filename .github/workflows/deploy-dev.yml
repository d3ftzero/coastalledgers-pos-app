name: Deploy Dev

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: ospos
          push: true
          tags: ${{ vars.IMAGE_REPOSITORY }}:dev
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          provenance: false

      - name: Build and push SQL init image
        uses: docker/build-push-action@v6
        with:
          context: app/Database
          file: app/Database/Dockerfile
          push: true
          tags: ${{ vars.IMAGE_REPOSITORY }}:dev-sql
          provenance: false

  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: Trigger deploy in deploy repo
        run: |
          gh workflow run deploy-client.yml \
            --repo d3ftzero/coastalledgers-pos-deploy \
            --field client_id=dev \
            --field release_tag=dev
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_REPO_TOKEN }}
